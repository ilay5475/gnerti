name: Сборка gnerti Hub

on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - '.github/workflows/build-hub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Иконка gnerti
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.Clear([System.Drawing.Color]::Transparent)
          $path = New-Object System.Drawing.Drawing2D.GraphicsPath
          $d = 110
          $path.AddArc(0, 0, $d, $d, 180, 90)
          $path.AddArc(255 - $d, 0, $d, $d, 270, 90)
          $path.AddArc(255 - $d, 255 - $d, $d, $d, 0, 90)
          $path.AddArc(0, 255 - $d, $d, $d, 90, 90)
          $path.CloseFigure()
          $g.FillPath((New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(12, 14, 28))), $path)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(115, 129, 255)), 28
          $g.DrawArc($pen, 61, 61, 134, 134, 30, 290)
          $g.FillRectangle((New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 123, 77))), 159, 105, 46, 46)
          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $png = $ms.ToArray()
          $fs = [System.IO.File]::Create("hub\gnerti.ico")
          $bw = New-Object System.IO.BinaryWriter $fs
          $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]1)
          $bw.Write([Byte]0); $bw.Write([Byte]0); $bw.Write([Byte]0); $bw.Write([Byte]0)
          $bw.Write([UInt16]1); $bw.Write([UInt16]32)
          $bw.Write([UInt32]$png.Length); $bw.Write([UInt32]22)
          $bw.Write($png)
          $bw.Close()

      - name: Сборка .exe
        run: dotnet publish hub/gnertiHub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Готовый файл
        shell: pwsh
        run: Copy-Item "out/gnerti Hub.exe" "gnerti-Hub.exe"

      - name: Выложить в релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hub *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create hub --title "gnerti Hub" --notes "Последняя версия gnerti Hub для Windows 10 и 11. Скачай gnerti-Hub.exe и запусти."
          }
          gh release upload hub gnerti-Hub.exe --clobber
